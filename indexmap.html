<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Vega: ubicar lotes sobre el satélite</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#f3f1e8; --ink:#1d2a1c; --palma:#2f6b2f; --aceite:#d9a21b; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); }
  body { display:flex; flex-direction:column; }
  #mapa { flex:1; min-height:0; }
  #plano { position:absolute; left:0; top:0; transform-origin:0 0; pointer-events:none; max-width:none !important; }
  .panel { background:var(--bg); border-top:3px solid var(--palma); padding:10px 14px 12px; }
  .fila { display:grid; grid-template-columns:110px 1fr 84px; gap:8px; align-items:center; margin-bottom:6px; font-size:.88rem; }
  .fila input[type=range] { width:100%; }
  .fila output, .fila input[type=number] { font-variant-numeric:tabular-nums; text-align:right; font-size:.85rem; width:100%; }
  .botones { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  button { font:inherit; font-size:.9rem; padding:7px 11px; border:1px solid var(--palma); background:#fff; color:var(--ink); border-radius:6px; cursor:pointer; }
  button.principal { background:var(--palma); color:#fff; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--aceite); outline-offset:2px; }
  .ayuda { font-size:.8rem; margin:8px 0 0; opacity:.8; }
  .asa { width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; background:var(--aceite); border:3px solid #fff; box-shadow:0 0 0 2px #0006; display:flex; align-items:center; justify-content:center; font-size:15px; color:#fff; cursor:move; }
  .yo { width:14px; height:14px; background:#fff; border:3px solid #1e6fd9; border-radius:50%; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b221a; --ink:#e8ebe0; } button { background:#273024; } button.principal { background:var(--palma); } }
</style>
</head>
<body>
<div id="aviso" style="display:none;background:#b3261e;color:#fff;padding:8px 12px;font-size:.9rem"></div>
<div id="mapa"></div>
<div class="panel">
  <div class="fila"><label for="tam">Tamaño</label><input id="tam" type="range" min="0" max="100" step="0.1"><input id="tamM" type="number" min="100" max="20000" step="10" aria-label="Ancho del plano en metros"></div>
  <div class="fila"><label for="giro">Giro</label><input id="giro" type="range" min="-180" max="180" step="0.5"><output id="giroV"></output></div>
  <div class="fila"><label for="opa">Transparencia</label><input id="opa" type="range" min="0.1" max="1" step="0.05"><output id="opaV"></output></div>
  <div class="botones">
    <button id="bCentro" class="principal">Traer plano al centro</button>
    <button id="bGps">Mi ubicación / centrar en mí</button>
    <button id="bVer">Ocultar plano</button>
    <button id="bFijar">Fijar posición</button>
  </div>
  <p class="ayuda">1) Mueve el mapa hasta la finca y toca Traer plano al centro. 2) Arrastra el punto dorado para mover el plano. 3) Ajusta tamaño (ancho en metros) y giro hasta que los lotes coincidan con las siembras. El norte del plano apunta arriba cuando el giro es 0.</p>
</div>

const mapa = L.map('mapa', { zoomAnimation:false, maxZoom:19 }).setView([3.71, -73.24], 13);
const satelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution:'Imágenes © Esri', maxZoom:19 }).addTo(mapa);
let fallos = 0, alterno = false;
satelite.on('tileerror', () => {
  fallos++;
  if (fallos === 6 && !alterno) { alterno = true; satelite.setUrl('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'); }
  if (fallos === 14) { const a = document.getElementById('aviso'); a.dataset.tipo = 'tiles'; a.style.display = 'block'; a.textContent = 'No cargan las imágenes satelitales. Revisa tu conexión a internet o abre el archivo directamente en el navegador.'; }
});
satelite.on('tileload', () => { const a = document.getElementById('aviso'); if (a.dataset.tipo === 'tiles') { a.style.display = 'none'; a.dataset.tipo = ''; } });
const calles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap', maxZoom:19 });
L.control.layers({ 'Satélite':satelite, 'Calles':calles }, null, { position:'topright' }).addTo(mapa);

const estado = { lat:3.71, lng:-73.24, ancho:2000, giro:0, opa:0.6, fijo:false, visible:true };
try { Object.assign(estado, JSON.parse(localStorage.getItem('la-vega-plano') || '{}')); } catch (e) {}
function guardar() { try { localStorage.setItem('la-vega-plano', JSON.stringify(estado)); } catch (e) {} }

const img = document.createElement('img');
img.id = 'plano'; img.className = 'leaflet-image-layer'; img.alt = 'Plano de lotes La Vega'; img.src = IMG;
mapa.getPane('overlayPane').appendChild(img);

const asa = L.marker([estado.lat, estado.lng], { draggable:true, icon:L.divIcon({ className:'', html:'<div class="asa">✥</div>', iconSize:[0,0] }) }).addTo(mapa);
asa.on('drag', e => { const p = e.target.getLatLng(); estado.lat = p.lat; estado.lng = p.lng; colocar(); });
asa.on('dragend', guardar);

function colocar() {
  if (!img.naturalWidth) return;
  const c = L.latLng(estado.lat, estado.lng);
  const p = mapa.latLngToLayerPoint(c);
  const mPorPx = 40075016.686 * Math.cos(c.lat * Math.PI / 180) / (256 * Math.pow(2, mapa.getZoom()));
  const s = (estado.ancho / mPorPx) / img.naturalWidth;
  img.style.transform = `translate(${p.x}px,${p.y}px) rotate(${estado.giro}deg) scale(${s}) translate(${-img.naturalWidth/2}px,${-img.naturalHeight/2}px)`;
  img.style.opacity = estado.opa;
  img.style.display = estado.visible ? '' : 'none';
}
mapa.on('zoom viewreset zoomend moveend', colocar);
img.onload = colocar;

// Controles
const $ = id => document.getElementById(id);
const aSlider = m => 100 * Math.log(m / 200) / Math.log(40);
const aMetros = v => 200 * Math.pow(40, v / 100);
function refrescar() {
  $('tam').value = aSlider(estado.ancho); $('tamM').value = Math.round(estado.ancho);
  $('giro').value = estado.giro; $('giroV').textContent = estado.giro.toFixed(1) + '°';
  $('opa').value = estado.opa; $('opaV').textContent = Math.round(estado.opa * 100) + '%';
  $('bVer').textContent = estado.visible ? 'Ocultar plano' : 'Mostrar plano';
  $('bFijar').textContent = estado.fijo ? 'Soltar posición' : 'Fijar posición';
  asa.setOpacity(estado.fijo ? 0 : 1); if (asa.dragging) estado.fijo ? asa.dragging.disable() : asa.dragging.enable();
  asa.setLatLng([estado.lat, estado.lng]);
  colocar(); guardar();
}
$('tam').oninput = e => { estado.ancho = aMetros(+e.target.value); refrescar(); };
$('tamM').onchange = e => { estado.ancho = Math.min(20000, Math.max(100, +e.target.value || 2000)); refrescar(); };
$('giro').oninput = e => { estado.giro = +e.target.value; refrescar(); };
$('opa').oninput = e => { estado.opa = +e.target.value; refrescar(); };
$('bVer').onclick = () => { estado.visible = !estado.visible; refrescar(); };
$('bFijar').onclick = () => { estado.fijo = !estado.fijo; refrescar(); };
$('bCentro').onclick = () => { const c = mapa.getCenter(); estado.lat = c.lat; estado.lng = c.lng; estado.fijo = false; refrescar(); };

let yo = null, circ = null, ultima = null, vigilando = null;
function estadoGps(msg, ok) {
  const a = document.getElementById('aviso');
  a.dataset.tipo = ''; a.style.display = msg ? 'block' : 'none';
  a.style.background = ok ? '#2f6b2f' : '#b3261e';
  a.textContent = msg || '';
}
function mostrarYo(pos, centrar) {
  const p = L.latLng(pos.coords.latitude, pos.coords.longitude);
  ultima = p;
  if (!yo) {
    yo = L.marker(p, { icon:L.divIcon({ className:'', html:'<div class="yo" style="width:20px;height:20px;border-width:4px;box-shadow:0 0 0 3px #1e6fd955"></div>', iconSize:[20,20], iconAnchor:[10,10] }), interactive:false, zIndexOffset:1000 }).addTo(mapa);
    circ = L.circle(p, { radius:pos.coords.accuracy, color:'#1e6fd9', weight:1, interactive:false }).addTo(mapa);
  } else { yo.setLatLng(p); circ.setLatLng(p).setRadius(pos.coords.accuracy); }
  if (centrar) mapa.setView(p, Math.max(mapa.getZoom(), 17));
  estadoGps('Estás aquí. Precisión aproximada: ' + Math.round(pos.coords.accuracy) + ' m', true);
}
function errorGps(err) {
  const causas = {
    1: 'Permiso de ubicación denegado. Activa la ubicación para este navegador y para este sitio, y vuelve a tocar Mi ubicación.',
    2: 'No se pudo determinar la posición. Activa el GPS del celular y sal a un lugar abierto.',
    3: 'La ubicación tardó demasiado. Inténtalo de nuevo al aire libre.'
  };
  let m = causas[err.code] || ('No se pudo obtener la ubicación: ' + err.message);
  if (err.code === 1 && location.protocol !== 'https:') m += ' Nota: los navegadores del celular suelen bloquear la ubicación en archivos locales; si pasa, publica el archivo en un sitio https (por ejemplo Netlify Drop o GitHub Pages).';
  estadoGps(m, false);
}
$('bGps').onclick = () => {
  if (!navigator.geolocation) { estadoGps('Este navegador no permite geolocalización.', false); return; }
  if (ultima) { mapa.setView(ultima, Math.max(mapa.getZoom(), 17)); return; }
  estadoGps('Buscando tu ubicación... acepta el permiso si el navegador lo pide.', true);
  let primera = true;
  vigilando = navigator.geolocation.watchPosition(pos => { mostrarYo(pos, primera); primera = false; }, errorGps,
    { enableHighAccuracy:true, maximumAge:2000, timeout:20000 });
};

refrescar();
if (localStorage.getItem('la-vega-plano')) mapa.setView([estado.lat, estado.lng], 14);
</script>
